<!DOCTYPE html>
<html lang="zh-CN">
<head>
<title>清锋网络</title>
<link href="favicon.ico" rel="shortcut icon" type="image/x-icon">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="./css/index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<!-- 头部内容结束 -->

<body>
<div class="avatar-wrapper">
<img src="./img/head.jpg" class="avatar">
</div>

<!-- 修改为包含微信和QQ的联系容器 -->
<div class="contact-container">
<div class="contact-item">
<span id="wechatId">微信：FenerSS</span>
<button class="copy-btn wechat-copy-btn" onclick="copyWechat()">复制</button>
</div>
<div class="contact-item">
<span id="qqId">QQ：1065613791</span>
<button class="copy-btn qq-copy-btn" onclick="copyQQ()">复制</button>
</div>
</div>

<div class="nav-container">
<!--onclick参数【"window.open('./地址')"】是新窗口打开-->
<!--onclick参数【"window.open('./地址', '_self')"】是当前窗口打开-->

<!-- 内容分割线 -->
<button class="nav-btn" onclick="window.open('./ywxd', '_self')">业务小店</button>
<button class="nav-btn" onclick="window.open('./yyzx', '_self')">应用中心</button>
<button class="nav-btn" onclick="window.open('./qfdh', '_self')">清锋导航</button>
<!-- 内容分割线 -->

</div>

<div class="toast" id="toast">复制成功</div>

<div class="record-link">
<span>清锋网络 &copy; 2026</span>
</div>

<!-- 微信客服按钮 -->
<div class="wechat-support-btn" onclick="showWechatQRCode()">
<i class="fab fa-weixin"></i>
</div>

<!-- 微信客服二维码弹窗 -->
<div class="wechat-qrcode-modal" id="wechatQrcodeModal">
<img class="wechat-qrcode" src="./img/wx2wm.jpg">
</div>

<script>
// 复制微信
const copyWechat = async () => {
const text = 'FenerSS';
try {
await navigator.clipboard.writeText(text);
showToast('微信号复制成功');
} catch (err) {
const input = document.createElement('input');
input.value = text;
document.body.appendChild(input);
input.select();
document.execCommand('copy');
document.body.removeChild(input);
showToast('微信号复制成功');
}
};

// 复制QQ
const copyQQ = async () => {
const text = '1065613791';
try {
await navigator.clipboard.writeText(text);
showToast('QQ号复制成功');
} catch (err) {
const input = document.createElement('input');
input.value = text;
document.body.appendChild(input);
input.select();
document.execCommand('copy');
document.body.removeChild(input);
showToast('QQ号复制成功');
}
};

// 优化提示框函数，支持自定义文字
const showToast = (message = '复制成功') => {
const toast = document.getElementById('toast');
toast.textContent = message;
toast.classList.add('show');
setTimeout(() => toast.classList.remove('show'), 1500);
};

// 禁用双击缩放
document.addEventListener('dblclick', (e) => {
e.preventDefault();
}, { passive: false });

// 显示微信客服二维码弹窗
const showWechatQRCode = () => {
const modal = document.getElementById('wechatQrcodeModal');
modal.classList.add('show');
document.addEventListener('click', closeWechatQRCodeOnClickOutside);
};

// 点击弹窗外部关闭二维码弹窗
const closeWechatQRCodeOnClickOutside = (e) => {
const modal = document.getElementById('wechatQrcodeModal');
if (e.target === modal) {
modal.classList.remove('show');
document.removeEventListener('click', closeWechatQRCodeOnClickOutside);
}
};
</script>
</body>
</html>
